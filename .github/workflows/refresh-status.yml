name: Refresh live.json

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
  push:
    paths:
      - "packs.json"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build live.json from packs.json
        run: |
          mkdir -p data
          python3 - <<'EOF'
          import json
          from datetime import datetime, timezone

          with open("packs.json") as f:
              source = json.load(f)

          out = {
              "lastUpdated": datetime.now(timezone.utc).isoformat(),
              "packs": [
                  {
                      "slug": p["slug"],
                      "title": p["title"],
                      "username": p["username"]
                  }
                  for p in source["packs"]
              ]
          }

          with open("data/live.json", "w") as f:
              json.dump(out, f, indent=2, ensure_ascii=False)
          EOF

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/live.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: refresh live.json [$(date -u +'%Y-%m-%dT%H:%MZ')]"
            git push
          fi
