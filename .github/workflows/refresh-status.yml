name: Refresh live.json

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
  push:
    paths:
      - "packs.json"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build live.json — only approved packs
        run: |
          mkdir -p data
          python3 - <<'EOF'
          import json
          import urllib.request
          from datetime import datetime, timezone

          UA = "datapacks-status-action/1.0 (extamorzen@gmail.com)"

          with open("packs.json") as f:
              source = json.load(f)

          out = {
              "lastUpdated": datetime.now(timezone.utc).isoformat(),
              "packs": []
          }

          for entry in source["packs"]:
              slug = entry["slug"]
              try:
                  req = urllib.request.Request(
                      f"https://api.modrinth.com/v2/project/{slug}",
                      headers={"User-Agent": UA}
                  )
                  with urllib.request.urlopen(req, timeout=15) as r:
                      data = json.load(r)
                  if data.get("status") == "approved":
                      out["packs"].append({
                          "slug": slug,
                          "title": entry.get("title") or data.get("title") or slug,
                          "username": entry["username"]
                      })
              except Exception:
                  # 404 = pack pas encore approuvé, on l'ignore
                  pass

          with open("data/live.json", "w") as f:
              json.dump(out, f, indent=2, ensure_ascii=False)
          EOF

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/live.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: refresh live.json [$(date -u +'%Y-%m-%dT%H:%MZ')]"
            git push
          fi
